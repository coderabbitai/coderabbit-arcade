name: Build

# Exports macOS, Windows, Linux and Web builds with tools/build/export_game.py and boots the Linux
# build headless through every route. Every PR is export-checked; downloadable builds are kept
# for main, v* tags, manual runs and PRs labelled `preview-build`. A v* tag publishes a release.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  export:
    name: export
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # A label event only matters when it adds preview-build.
    if: github.event.action != 'labeled' || github.event.label.name == 'preview-build'
    env:
      KEEP_BUILDS: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'preview-build') }}
      RETENTION_DAYS: ${{ github.event_name == 'pull_request' && 7 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pinned Godot and export templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/coderabbit-arcade/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ hashFiles('tools/build/godot.lock.json') }}

      - name: Fetch and verify Godot
        run: |
          godot_path=$(python3 tools/build/fetch_godot.py --templates)
          echo "GODOT=$godot_path" >> "$GITHUB_ENV"

      - name: Export and smoke-test
        run: python3 tools/build/export_game.py --godot "$GODOT" --smoke

      # One artifact per platform, so testers download only the build they need.
      - name: Upload macOS build
        if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoppys-adventure-arcade-macos
          path: |
            build/dist/*-macos.zip
            build/dist/BUILD_MANIFEST.json
            build/dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload Windows build
        if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoppys-adventure-arcade-windows
          path: |
            build/dist/*-windows.zip
            build/dist/BUILD_MANIFEST.json
            build/dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload Linux build
        if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoppys-adventure-arcade-linux
          path: |
            build/dist/*-linux.zip
            build/dist/BUILD_MANIFEST.json
            build/dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload Web build
        if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoppys-adventure-arcade-web
          path: |
            build/dist/*-web.zip
            build/dist/BUILD_MANIFEST.json
            build/dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  release:
    name: release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hoppys-adventure-arcade-*
          merge-multiple: true
          path: dist
      - name: Verify release downloads
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 4
          sha256sum --check SHA256SUMS.txt

      - name: Publish playtest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Stage all assets in a draft before making the release visible. A failed
          # upload can be retried without creating a second release or a partial public one.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > release.json; then
            if ! jq -e '.isDraft' release.json > /dev/null; then
              echo "::error::Release $TAG is already published. Use a new version/tag for a new build."
              exit 1
            fi
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Hoppy's Adventure Arcade $TAG" \
              --generate-notes \
              --draft --prerelease
          fi
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
