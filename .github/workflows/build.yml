name: Build

# Exports macOS, Windows and Linux builds with tools/build/export_game.py and boots the Linux
# build headless through every route. Every PR is export-checked; downloadable builds are kept
# for main, v* tags, manual runs and PRs labelled `preview-build`. A v* tag publishes a release.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: export
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # A label event only matters when it adds preview-build.
    if: github.event.action != 'labeled' || github.event.label.name == 'preview-build'
    env:
      KEEP_BUILDS: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'preview-build') }}
      RETENTION_DAYS: ${{ github.event_name == 'pull_request' && 7 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pinned Godot and export templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/coderabbit-arcade/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ hashFiles('tools/build/godot.lock.json') }}

      - name: Fetch and verify Godot
        run: echo "GODOT=$(python3 tools/build/fetch_godot.py --templates)" >> "$GITHUB_ENV"

      - name: Export and smoke-test
        run: python3 tools/build/export_game.py --godot "$GODOT" --smoke

      # One artifact per platform, so testers download only the build they need.
      - name: Upload macOS build
        if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoppys-adventure-arcade-macos
          path: |
            build/dist/*-macos.zip
            build/dist/BUILD_MANIFEST.json
            build/dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload Windows build
        if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoppys-adventure-arcade-windows
          path: |
            build/dist/*-windows.zip
            build/dist/BUILD_MANIFEST.json
            build/dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload Linux build
        if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoppys-adventure-arcade-linux
          path: |
            build/dist/*-linux.zip
            build/dist/BUILD_MANIFEST.json
            build/dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  release:
    name: release
    if: github.ref_type == 'tag'
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hoppys-adventure-arcade-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hoppy's Adventure Arcade $TAG" \
            --generate-notes \
            --prerelease
