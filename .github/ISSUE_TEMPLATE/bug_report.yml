name: Bug report
description: Something in the arcade is broken or behaves unexpectedly.
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Main menu / hub
        - Platformer — Bay Area Blitz
        - Platformer — Orbital Ops
        - Platformer — The Enchanted Repo
        - Endless Runner
        - Beat'em Up
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Platformer → Level Select → Orbital Ops
        2. Hold Jump in the zero-gravity bay
        3. ...
    validations:
      required: true
  - type: input
    id: godot
    attributes:
      label: Godot version
      placeholder: 4.7.1.stable
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and input device
      placeholder: macOS 15, keyboard / Windows 11, Xbox controller
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or video
      description: Godot output, or test logs if a test fails.
      render: text
