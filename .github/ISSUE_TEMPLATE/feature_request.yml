name: Feature request
description: Suggest a new mechanic, level, power-up or improvement.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: Describe the idea and the problem it solves or the fun it adds.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Affected modes, controls, rough design, references or mockups.
  - type: checkboxes
    id: assets
    attributes:
      label: Assets
      options:
        - label: Any assets this needs are original or CC0/CC BY (see CONTRIBUTING.md).
